<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#0d2027"><title>Lanterne — Les jardins du crépuscule</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d2027;color:#ffe1a5;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
    body{display:grid;place-items:center}main{position:relative;width:min(100vw,620px);height:min(100vh,900px);display:grid;place-items:center}canvas{width:100%;height:100%;background:#122c30;box-shadow:0 0 50px #061318}#hud{position:absolute;top:20px;left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none;font-size:12px;letter-spacing:1px}.pill{padding:8px 12px;border:1px solid #71958a55;border-radius:99px;background:#0d2027cc}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:28px;text-align:center;background:#0d2027cc}.card{max-width:390px;padding:28px;border:1px solid #71958a66;border-radius:22px;background:#162f34ee;box-shadow:0 20px 60px #07171c}.eyebrow{color:#8de1c2;font-size:11px;letter-spacing:2px}.title{margin:14px 0;font:58px Georgia,serif;color:#ffd18a}.sub{color:#c4d4ca;line-height:1.6}.button{border:0;border-radius:12px;padding:16px 22px;background:#ffd18a;color:#0d2027;font-weight:800;font-size:15px;cursor:pointer}.choices{display:grid;gap:10px;margin-top:20px}.choice{display:block;width:100%;text-align:left;background:#224145;color:#ffe1a5;border:1px solid #71958a88;border-radius:12px;padding:14px;cursor:pointer}.choice b{display:block;margin-bottom:5px}.choice span{color:#b9cdc1;font-size:12px}.hidden{display:none}
  </style>
</head>
<body><main><canvas id="game" width="440" height="640"></canvas><div id="hud"><span class="pill" id="wave">LANTERNE · VAGUE 1/5</span><span class="pill" id="score">0 ✦</span></div><div class="overlay" id="overlay"><div class="card"><div class="eyebrow">LES JARDINS DU CRÉPUSCULE</div><div class="title">Lanterne</div><p class="sub">Une petite lumière contre les ombres du jardin.<br>Glisse pour bouger, relâche pour tirer.</p><button class="button" id="start">Entrer dans le jardin</button></div></div></main><script src="game.js"></script></body>
</html>
